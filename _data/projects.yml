# ComPy-la-Webs
- project: ComPy-la-Webs
  description: Python to Web Assembly interpreter written in C++ that allows Python to be run in the browser, working by disassembling the Python script blocks in an HTML page into byte code and feeding that to a C++ program compiled into WASM that would run the Python byte code. Additionally, it allowed interpolation between JS and Python by allowing JS elements to be called from Python with a new unique keyword.

